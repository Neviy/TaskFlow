services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taskflow']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: golang:1.26-alpine
    container_name: taskflow-migrate
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskflow
    volumes:
      - ./migrations:/app/migrations
    command:
      - sh
      - -c
      - |
        go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
        /go/bin/goose -dir /app/migrations postgres "$$DATABASE_URL" up

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskflow
      PORT: 8080
    ports:
      - '8080:8080'

volumes:
  postgres_data:
